<svg viewBox="0 0 1180 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1180" height="480" fill="#ffffff"/>
  <text x="590" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Core mechanisms: from a spike to a memristor</text>

  <!-- panel dividers -->
  <line x1="295" y1="55" x2="295" y2="460" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="590" y1="55" x2="590" y2="460" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="885" y1="55" x2="885" y2="460" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ============ Panel 1: LIF / ALIF neuron ============ -->
  <text x="147" y="75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1950A0">1. LIF / ALIF neuron</text>

  <!-- axes -->
  <line x1="40" y1="220" x2="260" y2="220" stroke="#9ca3af" stroke-width="1"/>
  <line x1="40" y1="100" x2="40" y2="220" stroke="#9ca3af" stroke-width="1"/>
  <text x="150" y="235" text-anchor="middle" font-size="10" fill="#6b7280">time</text>
  <text x="24" y="160" text-anchor="middle" font-size="10" fill="#6b7280" transform="rotate(-90 24 160)">V_mem</text>

  <!-- threshold line (fixed, LIF) -->
  <line x1="40" y1="130" x2="260" y2="130" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="264" y="133" font-size="9.5" fill="#c0392b">V_th</text>

  <!-- membrane trace: leaky rise, spike, reset, rise again -->
  <path d="M40,220 C70,190 90,170 100,150 L100,220 C120,190 140,170 150,130 L150,220 C175,185 200,150 210,110 L210,220 C230,195 245,175 255,160"
        fill="none" stroke="#1950A0" stroke-width="2"/>
  <!-- spike ticks -->
  <line x1="100" y1="150" x2="100" y2="95" stroke="#1950A0" stroke-width="2"/>
  <line x1="150" y1="130" x2="150" y2="95" stroke="#1950A0" stroke-width="2"/>
  <line x1="210" y1="110" x2="210" y2="95" stroke="#1950A0" stroke-width="2"/>

  <!-- adaptive threshold (ALIF): rises after each spike, decays -->
  <path d="M40,130 L100,130 L100,105 C110,112 118,120 150,122 L150,98 C160,108 170,118 210,120 L210,90 C225,100 245,112 260,118"
        fill="none" stroke="#1f9d3a" stroke-width="1.6" stroke-dasharray="3,2"/>
  <text x="150" y="255" text-anchor="middle" font-size="9.5" fill="#1f9d3a" font-style="italic">green = ALIF's adaptive threshold (rises per spike, decays)</text>
  <text x="150" y="269" text-anchor="middle" font-size="9.5" fill="#374151">leak &#8594; integrate &#8594; spike &#8594; reset</text>

  <text x="147" y="300" text-anchor="middle" font-size="10.5" fill="#374151">M4b-7 found this adaptive threshold</text>
  <text x="147" y="314" text-anchor="middle" font-size="10.5" fill="#374151">is what gives shift-robustness</text>
  <text x="147" y="328" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">-- not the plasticity below.</text>

  <!-- ============ Panel 2: STDP kernel ============ -->
  <text x="442" y="75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1950A0">2. STDP: timing sets sign</text>

  <line x1="335" y1="180" x2="550" y2="180" stroke="#9ca3af" stroke-width="1"/>
  <line x1="442" y1="100" x2="442" y2="260" stroke="#9ca3af" stroke-width="1"/>
  <text x="555" y="184" font-size="10" fill="#6b7280">&#916;t = t_post - t_pre</text>
  <text x="446" y="104" font-size="10" fill="#6b7280">&#916;w</text>

  <!-- LTP (right side, pre before post -> positive) -->
  <path d="M442,180 C460,150 480,112 545,102" fill="none" stroke="#1950A0" stroke-width="2"/>
  <!-- LTD (left side, post before pre -> negative) -->
  <path d="M442,180 C424,205 404,245 339,255" fill="none" stroke="#c0392b" stroke-width="2"/>

  <text x="500" y="118" font-size="10" fill="#1950A0" font-weight="700">LTP (pre &#8594; post)</text>
  <text x="345" y="248" font-size="10" fill="#c0392b" font-weight="700">LTD (post &#8594; pre)</text>

  <text x="442" y="290" text-anchor="middle" font-size="10.5" fill="#374151">Hebbian only -- no notion of</text>
  <text x="442" y="304" text-anchor="middle" font-size="10.5" fill="#374151">task success. Pure-STDP ablation:</text>
  <text x="442" y="318" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">always the weakest controller.</text>

  <!-- ============ Panel 3: R-STDP three-factor rule ============ -->
  <text x="737" y="75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1950A0">3. R-STDP: reward gates it</text>

  <rect x="610" y="105" width="90" height="34" rx="6" fill="#eef3fb" stroke="#1950A0" stroke-width="1.2"/>
  <text x="655" y="126" text-anchor="middle" font-size="10.5" fill="#1950A0">pre/post spikes</text>

  <rect x="610" y="160" width="90" height="34" rx="6" fill="#eef3fb" stroke="#1950A0" stroke-width="1.2"/>
  <text x="655" y="181" text-anchor="middle" font-size="10.5" fill="#1950A0">eligibility e_ij</text>

  <rect x="760" y="160" width="100" height="34" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.2"/>
  <text x="810" y="176" text-anchor="middle" font-size="9.5" fill="#c0392b">reward / TD-error</text>
  <text x="810" y="188" text-anchor="middle" font-size="9.5" fill="#c0392b">r(t)</text>

  <rect x="685" y="220" width="90" height="34" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.2"/>
  <text x="730" y="241" text-anchor="middle" font-size="10.5" fill="#374151">&#916;w = &#951;&#183;r&#183;e</text>

  <path d="M655,139 L655,158" stroke="#1950A0" stroke-width="1.6" marker-end="url(#a3)"/>
  <path d="M700,177 L758,177" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a3)"/>
  <path d="M690,194 C700,205 715,212 720,218" stroke="#374151" stroke-width="1.6" marker-end="url(#a3)"/>
  <path d="M800,194 C790,205 770,212 760,218" stroke="#374151" stroke-width="1.6" marker-end="url(#a3)"/>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="737" y="290" text-anchor="middle" font-size="10.5" fill="#374151">task-relevant credit assignment --</text>
  <text x="737" y="304" text-anchor="middle" font-size="10.5" fill="#374151">but M5 found it doesn't beat a</text>
  <text x="737" y="318" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">frozen network on sensor dropout.</text>

  <!-- ============ Panel 4: memristor crossbar ============ -->
  <text x="1032" y="75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1950A0">4. Memristor crossbar analogy</text>

  <g stroke="#94a3b8" stroke-width="1.4">
    <line x1="950" y1="110" x2="950" y2="230"/>
    <line x1="990" y1="110" x2="990" y2="230"/>
    <line x1="1030" y1="110" x2="1030" y2="230"/>
    <line x1="1070" y1="110" x2="1070" y2="230"/>
    <line x1="1110" y1="110" x2="1110" y2="230"/>
    <line x1="930" y1="130" x2="1130" y2="130"/>
    <line x1="930" y1="160" x2="1130" y2="160"/>
    <line x1="930" y1="190" x2="1130" y2="190"/>
    <line x1="930" y1="220" x2="1130" y2="220"/>
  </g>
  <g>
    <circle cx="950" cy="130" r="5" fill="#1950A0"/>
    <circle cx="990" cy="160" r="7" fill="#1950A0"/>
    <circle cx="1030" cy="190" r="4" fill="#1950A0"/>
    <circle cx="1070" cy="130" r="6" fill="#1950A0"/>
    <circle cx="1110" cy="220" r="5" fill="#1950A0"/>
    <circle cx="950" cy="220" r="8" fill="#1950A0"/>
    <circle cx="1030" cy="130" r="3" fill="#1950A0"/>
  </g>
  <text x="1032" y="250" text-anchor="middle" font-size="9.5" fill="#6b7280">dot size = conductance g &#8801; weight w</text>

  <text x="1032" y="290" text-anchor="middle" font-size="10.5" fill="#374151">state retention, saturation, locality --</text>
  <text x="1032" y="304" text-anchor="middle" font-size="10.5" fill="#374151">the FPGA update array reproduces this</text>
  <text x="1032" y="318" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">structure, not the device physics.</text>
</svg>
